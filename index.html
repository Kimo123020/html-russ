<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Liza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #ffd2d2b7; 
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .flag {
      background-color: white;
      width: 900px;
      height: 600px;
      position: relative;
    }

    .flag > div {
      background-color: #002868;
      width: 100%;
      height: 200px;
      position: absolute;
      top: 200px;
    }

    .flag > div > div {
      background-color: red;
      height: 200px;
      width: 100%;
      position: absolute;
      top: 200px;
    }

    p {
      font-size: 5rem; 
      color: black;
      text-align: center; 
      padding: 0;
      margin: 0;
      padding-top: 40px;
    }

    .flag > div div p {
      color: white;
    }

    .Kimo p {
      z-index: 10;
      position: absolute;
      font-size: 5rem;
      color: #ffd700;
      font-weight: 900;
      padding-left: 330px;
    }
  </style>
</head>

<body>

  <div class="flag">  
    <div class="Kimo">
      <p>Kimo</p>
    </div>
    <p>The Flag</p>
    <div>
      <div>
        <p>of Russia</p>
      </div>
    </div>
  </div>

</body>

</html>
